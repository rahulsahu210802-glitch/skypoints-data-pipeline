resources:
  jobs:
    skypoints_daily:
      name: skypoints-daily-pipeline
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: 0 0 2 * * ?
        timezone_id: UTC
        pause_status: PAUSED
      environments:
        - environment_key: default
          spec:
            project_environment: ../pyproject.toml
      tasks:
        - task_key: ingest_members
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              profile_file_path: ${var.profile_file_path}
              batch_id: ${var.batch_id}
        - task_key: ingest_redemptions
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              redemption_file_path: ${var.redemption_file_path}
              batch_id: ${var.batch_id}
        - task_key: silver_members
          depends_on:
            - task_key: ingest_members
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/02_silver_members.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              batch_id: ${var.batch_id}
              as_of_date: ${var.as_of_date}
        - task_key: silver_redemptions
          depends_on:
            - task_key: ingest_redemptions
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/04_silver_redemptions.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              batch_id: ${var.batch_id}
        - task_key: gold_members
          depends_on:
            - task_key: silver_members
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/03_gold_country_targets.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              batch_id: ${var.batch_id}
        - task_key: data_quality
          depends_on:
            - task_key: gold_members
            - task_key: silver_redemptions
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/05_data_quality.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              batch_id: ${var.batch_id}
        - task_key: sample_validation
          depends_on:
            - task_key: data_quality
          environment_key: default
          notebook_task:
            notebook_path: ../tests/01_sample_pipeline_test.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              batch_id: ${var.batch_id}
