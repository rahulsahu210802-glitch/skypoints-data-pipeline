bundle:
  name: skypoints-member-pipeline

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog name that will contain the assessment schema.
    default: main
  schema:
    description: Schema that will contain the pipeline tables.
    default: skypoints
  cluster_id:
    description: Existing Databricks cluster ID used by the assessment workflow.
  profile_ind_path:
    description: IND daily member file or folder path in a Unity Catalog Volume.
    default: /Volumes/main/skypoints/landing/members/IND.xlsx
  profile_usa_path:
    description: USA daily member file or folder path in a Unity Catalog Volume.
    default: /Volumes/main/skypoints/landing/members/USA.xlsx
  profile_aus_path:
    description: AUS daily member file or folder path in a Unity Catalog Volume.
    default: /Volumes/main/skypoints/landing/members/AUS.xlsx
  redemption_file_path:
    description: Daily redemption JSON file or folder path in a Unity Catalog Volume.
    default: /Volumes/main/skypoints/landing/redemptions/

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
